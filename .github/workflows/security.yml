# Security Checks Workflow
# Purpose: Monitor dependencies for known vulnerabilities.
#
# The PHP/Composer half of this workflow was removed with the plugin: the
# Spoken Audio Node is a Node/TypeScript service (ADR-038). The analysis tools
# it runs — Praat, ffmpeg, ffprobe — are separate processes installed from the
# base image, not npm dependencies, so they are not covered here. Their
# versions and licences are governed by `tools.pinned.json` and checked by
# `pnpm run verify:tools` in CI.
name: Security Checks

on:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight UTC
  workflow_dispatch: # allow manual runs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Report pinned analysis tools
        run: |
          echo "Pinned external tools and the licences recorded for them:"
          node -e "
            const t = require('./tools.pinned.json');
            for (const tool of t.tools) {
              console.log(\`  \${tool.name} \${tool.pinnedVersion} — \${tool.licenseAttestation.license}\`);
              console.log(\`    read from \${tool.licenseAttestation.readFrom} on \${tool.licenseAttestation.recordedAt}\`);
            }
          "
