# CI for the Spoken Audio Node.
#
# The unusual step here is `verify:tools`. This service's measurements carry the
# tool version that produced them, so a drifted Praat or ffmpeg does not just
# change a number — it makes every result recorded afterwards a claim nobody can
# check. CI installs the pinned versions and refuses to proceed if what the
# runner has is not what `tools.pinned.json` records (ADR-038).
#
# The analysis tests are integration tests against those real tools. Mocking
# them would prove the parser matches the mock.
name: CI

on:
  # Branch pushes and pull requests both fire, so an unscoped `push` runs every
  # job twice on a PR branch. CI on this repository installs Praat and ffmpeg
  # and runs analysis against real audio; paying for that twice per push is
  # waste on a platform built around bandwidth and cost discipline.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint and test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends praat ffmpeg

      # Pinned to the same commit the repository's other workflows pin, per its
      # convention of pinning third-party actions to a hash. CodeQL flags an
      # unpinned tag here as a non-immutable action reference.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Boundary checks
        run: pnpm run validate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Verify the pinned analysis toolchain
        run: pnpm run verify:tools

      - name: Test
        run: pnpm test
