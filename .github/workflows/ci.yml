# CI Workflow
# Purpose: Execute full linting, static analysis, and integration tests for pushes and pull requests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
      # uses: shivammathur/setup-php@v2
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1
        with:
          php-version: '8.3'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Setup pnpm
      # uses: pnpm/action-setup@v4
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint checks (no mutation)
        run: |
          pnpm run lint
          composer run lint

      - name: Check bundle sizes
        run: pnpm run size-check

      - name: Validate STAR/AIWA compliance
        run: |
          pnpm run i18n-check
          grep -q "WordPress.*6\.8" starmus-audio-recorder.php || echo "⚠️ WordPress 6.8+ requirement not found"
          grep -r "star-" src/ || echo "⚠️ STAR prefix not found in source"

      - name: Run static analysis
        run: |
          pnpm run lint:js
          pnpm run lint:css
          composer run analyze

      - name: Start WordPress test environment
        run: pnpm run env:start

      - name: WordPress Integration Tests
        run: pnpm run test:wp-env

      - name: Stop WordPress test environment
        run: pnpm run env:stop

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E Tests (Offline & Accessibility)
        run: |
          pnpm run test:e2e
          pnpm run test:a11y
