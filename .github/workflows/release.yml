# .github/workflows/release.yml
#
# Release for the Spoken Audio Node.
#
# The previous workflow built a WordPress plugin ZIP — plugin header, Composer
# autoloader, minified frontend assets, `.distignore`. None of that exists after
# the ADR-038 restructure. What ships now is a compiled Node/TypeScript service.
#
# The release gate includes `verify:tools`: a build whose pinned Praat or ffmpeg
# does not match `tools.pinned.json` must not be released, because every
# measurement it produces names a tool version, and a version that drifted makes
# those records unverifiable.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the version from the tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Tag v$VERSION does not match package.json version $PKG_VERSION."
            echo "Update package.json and re-tag; the release does not rewrite it."
            exit 1
          fi
          echo "Version $VERSION confirmed."

      - name: Install pinned analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends praat ffmpeg

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boundary checks
        run: pnpm run validate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Verify the pinned analysis toolchain
        run: pnpm run verify:tools

      - name: Test
        run: pnpm test

      - name: Verify build output
        run: |
          test -f dist/index.js || { echo "Missing compiled entry point"; exit 1; }
          test -f dist/index.d.ts || { echo "Missing type declarations"; exit 1; }
          test -f praat/measure.praat || { echo "Missing measure script"; exit 1; }
          test -f praat/segment.praat || { echo "Missing segment script"; exit 1; }
          test -f tools.pinned.json || { echo "Missing pinned toolset"; exit 1; }
          echo "Build output verified."

      - name: Package the service
        run: |
          TARBALL="spoken-audio-node-${VERSION}.tar.gz"
          tar -czf "$TARBALL" dist praat tools.pinned.json package.json LICENSE.md README.md
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "Packaged $TARBALL"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: ${{ env.TARBALL }}
          generate_release_notes: true
