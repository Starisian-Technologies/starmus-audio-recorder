version: 2
registries: {}
updates:
  # The Composer ecosystem was removed with the plugin: the Spoken Audio Node
  # is a Node/TypeScript service and has no PHP dependencies (ADR-038).
  #
  # Praat, ffmpeg and ffprobe are not dependencies either — they are separate
  # processes installed from the base image, pinned per job class in
  # `tools.pinned.json`, and checked by `pnpm run verify:tools`. Dependabot
  # cannot bump them, and it should not: a version change there is a governance
  # act that requires re-reading the tool's licence from its own distribution.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - MaximillianGroup

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - MaximillianGroup
